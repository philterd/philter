# TLS. Off by default so the jar serves plain HTTP, which is what a deployment wants when a load
# balancer or ingress terminates TLS ahead of it. The Docker image sets SSL_ENABLED=true and its
# entrypoint generates a self-signed certificate on first start, so the container serves HTTPS.
# The port does not change: it is 8080 either way.
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:/opt/philter/ssl/philter.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:philter}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:philter}

# Mutual TLS. With SSL_CLIENT_AUTH=need, a client must present a certificate issued by one in the
# trust store; with want, one is requested but not required. Off (none) by default. The trust store
# itself, SSL_TRUSTSTORE, is set by ClientCertificateConfig, since an empty location fails startup.
server.ssl.client-auth=${SSL_CLIENT_AUTH:none}
server.ssl.trust-store-password=${SSL_TRUSTSTORE_PASSWORD:}
server.ssl.trust-store-type=${SSL_TRUSTSTORE_TYPE:PKCS12}

# Never let Tomcat rewrite the client address from X-Forwarded-For. On a detected cloud platform such as
# Kubernetes, Boot would otherwise trust the header from any private address, ahead of TRUSTED_PROXIES.
server.forward-headers-strategy=none

# Expose only the health and Prometheus actuator endpoints.
# Prometheus scrapes metrics from /actuator/prometheus.
management.endpoints.web.exposure.include=health,prometheus

# The redaction worker and the webhook worker are both scheduled, and a redaction can take seconds.
# On Boot's default single-threaded scheduler they block each other, so a slow document delays webhook
# delivery and vice versa. Give each its own thread.
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:2}

# Where Philter stores its data: sqlite, the default, in the file SQLITE_PATH for a single instance, or mongodb,
# which several instances can share. See the storage settings in the docs.
philter.storage=${STORAGE_TYPE:sqlite}
philter.sqlite.path=${SQLITE_PATH:philter.db}
