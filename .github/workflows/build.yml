name: build
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:
# The build only checks out the code and runs Maven, so the token needs nothing more.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Run the Maven verify phase
        run: mvn --batch-mode --update-snapshots verify
