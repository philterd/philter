# Philter with SQLite storage, the default: one Philter instance and no database server. Its data is in the
# philter-data volume. For MongoDB storage, which several instances can share, use docker-compose.mongodb.yml.
services:

  philter:
    depends_on:
      ph-eye:
        condition: service_started
    build:
      context: .
    environment:
      # In-memory cache unless these are set. See README.md.
      # CACHE_HOSTNAME: valkey
      # CACHE_PORT: "6379"
      # CACHE_PASSWORD: ""  # set one: anyone who can reach the cache can delete Philter's entries
      # CACHE_SSL: "false"
      STORAGE_TYPE: sqlite
      SQLITE_PATH: /opt/philter/data/philter.db
      # Required, with no default: ./compose.sh generates one in .env. Changing it later orphans everything encrypted.
      PHILTER_ENCRYPTION_KEY: ${PHILTER_ENCRYPTION_KEY:?Run ./compose.sh to generate it in .env, or set it with openssl rand -base64 32}
      # Lets an administrator act on other users' data through the owner parameter. Off by default.
      # ADMIN_CROSS_USER_ACCESS_ENABLED: true
      # Lets ledger entries, which are evidence, be deleted. Off by default. Uncomment to run philter-test against this stack.
      # LEDGER_DELETION_ENABLED: true
      # 1 MB rather than the 10 MB default, so philter-test can test the limit without a large request.
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-1048576}
      # The admin user's first API key, required until the admin has one. Development placeholder: real data needs its own.
      PHILTER_BOOTSTRAP_API_KEY: ${PHILTER_BOOTSTRAP_API_KEY:-sk_developmentonlydevelopmentonly01}
      # HTTPS with a self-signed certificate, so curl needs -k. See docs/docs/settings.md to use your own.
      # SSL_KEYSTORE: /opt/philter/ssl/philter-cert.p12
      # SSL_KEYSTORE_PASSWORD: ""
    volumes:
      # The SQLite database, kept when the container is recreated. Back it up; see docs/docs/database.md#sqlite.
      - philter-data:/opt/philter/data
    ports:
      - "8080:8080"
    networks:
      - philter

  ph-eye:
    image: philterd/ph-eye:1.3.0-pii_en_small
    ports:
      - "18080:5000"
    networks:
      - philter
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all

volumes:
  philter-data:

networks:
  philter:
