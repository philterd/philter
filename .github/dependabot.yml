version: 2

updates:

  # package.json and package-lock.json are generated by the Vaadin Maven plugin from the
  # platform BOM plus the @NpmPackage annotations in PhilterApplication. Edits made directly
  # to them are reverted by the next prepare-frontend/build-frontend run, so npm versions are
  # changed either by an @NpmPackage pin or by raising vaadin.version in pom.xml.
  #
  # open-pull-requests-limit: 0 turns off version-update pull requests. Security-update pull
  # requests are exempt from the limit and still open, which is the intent: an advisory is
  # worth seeing even though the fix goes in Java rather than in the pull request.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Vaadin 25.2 targets react-router 7.x, and the generated overrides block forces the root
      # version onto every Vaadin package that expects ^7. A major bump has to come from the
      # platform.
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
